name: Release

on:
    workflow_dispatch:
        # Inputs the workflow accepts.
        inputs:
            ref:
                description: 'Commit Reference'
                default: 'master'
                required: true
            tag:
                description: 'Version Tag'
                default: 'v0.0.0'
                required: true

jobs:
    build-linux-windows:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Install Go
              uses: actions/setup-go@v2
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: arduino/setup-protoc@v1
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install native build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y g++ unzip zip

            - name: Install Node
              uses: actions/setup-node@v3
              with:
                  node-version: 22

            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.ref }}

            - name: Test Locales 💬
              run: |
                  npm ci
                  npm run test:locales

            - name: Build 🔧
              run: |
                  make clean && VERSION=${{ github.event.inputs.tag }} make release-linux-windows release-darwin-purego

            - name: Test
              run: |
                  make test

            - name: Upload Linux and Windows artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux-windows-artifacts
                  path: |
                      wowsimcli-amd64-linux.zip
                      wowsimcli-windows.exe.zip
                      wowsimmop-amd64-darwin.zip
                      wowsimmop-amd64-linux.zip
                      wowsimmop-windows.exe.zip

    build-darwin-arm64:
        runs-on: macos-latest
        permissions:
            contents: read
        steps:
            - name: Install Go
              uses: actions/setup-go@v2
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: arduino/setup-protoc@v1
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v3
              with:
                  node-version: 22

            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.ref }}

            - name: Build arm64 macOS 🔧
              run: |
                  make clean && npm ci && VERSION=${{ github.event.inputs.tag }} make release-darwin-arm64

            - name: Upload macOS arm64 artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: darwin-arm64-artifacts
                  path: |
                      wowsimcli-arm64-darwin.zip
                      wowsimmop-arm64-darwin.zip

    release:
        runs-on: ubuntu-latest
        needs:
            - build-linux-windows
            - build-darwin-arm64
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.ref }}

            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: release-artifacts

            - name: Collect artifacts
              run: find release-artifacts -name '*.zip' -exec cp {} . \;

            - name: Release
              uses: ncipollo/release-action@v1
              with:
                  commit: ${{ github.event.inputs.ref }}
                  tag: ${{ github.event.inputs.tag }}
                  generateReleaseNotes: true
                  makeLatest: true
                  artifactErrorsFailBuild: true
                  artifacts: |
                      wowsimcli-amd64-linux.zip
                      wowsimcli-windows.exe.zip
                      wowsimcli-arm64-darwin.zip
                      wowsimmop-amd64-darwin.zip
                      wowsimmop-arm64-darwin.zip
                      wowsimmop-amd64-linux.zip
                      wowsimmop-windows.exe.zip
